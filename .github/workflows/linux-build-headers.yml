name: Linux build headers
on:
  push:
    paths: ['.github/workflows/linux-build-headers.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  packages:
    runs-on: ubuntu-latest
    steps:
      - name: Download development packages from Debian
        run: |
          mkdir -p packages
          docker run --rm -v "$PWD/packages:/out" debian:trixie-slim sh -ec '
            apt-get update
            cd /out
            apt-get download libfreetype-dev libfontconfig-dev libpng-dev libbrotli-dev zlib1g-dev libexpat1-dev libxrandr-dev libxinerama-dev libxcursor-dev libxfixes-dev libxrender-dev libxext-dev libasound2-dev libgl-dev libglx-dev libglvnd-core-dev
          '
      - uses: actions/upload-artifact@v4
        with:
          name: linux-development-packages
          path: packages/*.deb
          retention-days: 3
