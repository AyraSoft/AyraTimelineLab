name: Portable validation
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sources:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate source boundaries and visual adapter
        run: |
          python3 tools/check_panel_boundary.py
          python3 tests/identity/test_visual_adapter.py
          python3 tools/generate.py --check
      - name: Test the production event-row layout (no provider required)
        run: |
          c++ -std=c++20 -Wall -Wextra -Wpedantic tests/EventRowLayoutTests.cpp -o /tmp/ayra-event-layout
          /tmp/ayra-event-layout
      - name: Compact vertical preview presets (portable C++20)
        run: |
          c++ -std=c++20 -Wall -Wextra -Wpedantic -Werror tests/HeightPresetTests.cpp -o /tmp/ayra-height-presets
          /tmp/ayra-height-presets
      - name: Compact MIDI note geometry and sanitizers
        run: |
          c++ -std=c++20 -O2 -Wall -Wextra -Wpedantic -Werror tests/MidiPreviewTests.cpp -o /tmp/ayra-midi-preview
          /tmp/ayra-midi-preview
          c++ -std=c++20 -g -fsanitize=address,undefined -fno-omit-frame-pointer tests/MidiPreviewTests.cpp -o /tmp/ayra-midi-preview-asan
          /tmp/ayra-midi-preview-asan
      - name: Archive exact tracked sources (no Git credentials or working files)
        run: git archive --format=zip --output=source-bundle.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: source-bundle
          path: source-bundle.zip
          retention-days: 3
