name: Compact delivery history
on:
  push:
    branches: [fix/compact-lanes-card-gesture-20261021]
    paths: [.github/workflows/compact-delivery-transfer.yml]
permissions:
  contents: read
jobs:
  history:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Capture repository objects without credentials or working files
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse origin/main
          git bundle create history.bundle --all
          git bundle verify history.bundle
      - uses: actions/upload-artifact@v4
        with:
          name: compact-delivery-history
          path: history.bundle
          retention-days: 3
