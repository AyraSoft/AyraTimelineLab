name: Compact delivery build headers
on:
  push:
    branches: [fix/compact-lanes-card-gesture-20261021]
    paths: [.github/workflows/compact-delivery-transfer.yml]
permissions:
  contents: read
jobs:
  headers:
    runs-on: ubuntu-latest
    steps:
      - name: Download matching Debian development packages
        run: |
          mkdir -p packages
          docker run --rm -v "$PWD/packages:/out" debian:trixie-slim sh -ec '
            apt-get update
            cd /out
            apt-get download libfreetype-dev libfontconfig-dev libpng-dev libbrotli-dev zlib1g-dev libexpat1-dev libxrandr-dev libxinerama-dev libxcursor-dev libxfixes-dev libxrender-dev libxext-dev libasound2-dev libgl-dev libglx-dev libglvnd-core-dev
          '
      - uses: actions/upload-artifact@v4
        with:
          name: compact-delivery-headers
          path: packages/*.deb
          retention-days: 3
