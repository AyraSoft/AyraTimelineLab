<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<style>
  .frosted-demo {
    background: #090c12; padding: 16px; border-radius: 8px; max-width: 920px;
    font-family: -apple-system, BlinkMacSystemFont, "Inter", sans-serif;
  }
  .frosted-lane {
    position: relative; height: 64px; background: #101520; border-radius: 6px;
    display: flex; align-items: flex-start; padding: 8px; box-sizing: border-box;
    background-image: radial-gradient(circle at 75px 32px, rgba(56, 189, 248, 0.28), transparent 90px);
  }
  .frosted-lens {
    display: inline-flex; flex-direction: column; gap: 2px;
    padding: 5px 14px 6px 10px; border-radius: 7px;
    max-width: 205px; min-width: 120px; pointer-events: none;
    background: linear-gradient(105deg, rgba(17, 23, 36, 0.72) 0%, rgba(17, 23, 36, 0.32) 75%, transparent 100%);
    backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px);
    box-shadow: inset 0 0.5px 0 rgba(255, 255, 255, 0.12);
  }
  .frosted-top-meta {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
  }
  .frosted-perf {
    pointer-events: auto; font-size: 9.5px; font-weight: 650;
    text-transform: uppercase; letter-spacing: 0.07em; color: #a5b4fc;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .frosted-type {
    display: inline-flex; align-items: center; gap: 4px; flex-shrink: 0;
    font-size: 9.5px; font-weight: 500; color: #94a3b8;
  }
  .frosted-dot {
    width: 5px; height: 5px; border-radius: 50%; background: #38bdf8;
    box-shadow: 0 0 5px #38bdf8;
  }
  .frosted-track {
    pointer-events: auto; font-size: 12.5px; font-weight: 560;
    color: #f1f5f9; letter-spacing: -0.01em;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
</style>
</head>
<body>
  <div class="frosted-demo">
    <div class="frosted-lane">
      <div class="frosted-lens">
        <div class="frosted-top-meta">
          <span class="frosted-perf">Ayra</span>
          <span class="frosted-type"><i class="frosted-dot"></i>Audio</span>
        </div>
        <div class="frosted-track">Rhythm Guitars — Left Quad</div>
      </div>
    </div>
  </div>
</body>
</html>
