function validate(s){
 if(!s||s.schema!=='ayra-timeline-lab/1'||!Array.isArray(s.tracks)||s.tracks.length<1||s.tracks.length>256)throw Error('Formato Lab non supportato');
 if(typeof s.songId!=='string'||!s.songId||s.songId.length>128||!['grouped','free'].includes(s.mode)||typeof s.dark!=='boolean'||typeof s.groupCollapsed!=='boolean'||!Number.isInteger(s.headerWidth)||s.headerWidth<320||s.headerWidth>480||!Number.isFinite(s.zoom)||s.zoom<20||s.zoom>100)throw Error('Vista non valida');

 for(const t of s.tracks){if(typeof t.id!=='string'||!t.id||t.id.length>128||ids.has(t.id)||!Object.hasOwn(roleNames,t.role))throw Error('Identità non valida');ids.add(t.id);if(t.role==='songMain')main++;
 for(const k of ['name','group','groupName','route','monitor'])if(typeof t[k]!=='string'||t[k].length>256)throw Error('Metadata non validi');
 if(!t.name||!t.group||!['Auto','Live','Playback','Merge'].includes(t.monitor)||!/^#[0-9a-f]{6}$/i.test(t.colour))throw Error('Nome, monitoring o colore non validi');

 if(t.mute&&t.solo||t.role==='songMain'&&t.solo)throw Error('Stato M/S non valido');

}
function announce(text){$('#status').textContent=text;}
function commit(s,label){try{validate(s);}catch(e){announce(e.message);return false;}if(JSON.stringify(s)===JSON.stringify(state))return false;past.push({state:clone(state),action});if(past.length>96)past.shift();future=[];state=s;action=label;render();announce(label+' · solo banco di test');return true;}
function editTrack(id,key,value,label){const s=clone(state),t=s.tracks.find(x=>x.id===id);if(!t)return false;t[key]=value;return commit(s,label);}

function redo(){if(!future.length)return;past.push({state:clone(state),action});const f=future.pop();state=f.state;action=f.action;render();announce('Ripristinato: '+action);}
function toggle(id,key){const s=clone(state),t=s.tracks.find(x=>x.id===id);if(!t||key==='solo'&&t.role==='songMain')return;t[key]=!t[key];if(key==='mute'&&t.mute)t.solo=false;if(key==='solo'&&t.solo)t.mute=false;commit(s,`${t.name} · ${key}`);}
function move(ids,anchor,after){if(state.mode!=='free'||!track(anchor)||track(anchor).pinned||ids.includes(anchor)||ids.some(id=>!track(id)||track(id).pinned)||new Set(ids).size!==ids.length)return false;const s=clone(state),moving=s.manualOrder.filter(id=>ids.includes(id)),rest=s.manualOrder.filter(id=>!ids.includes(id));const at=rest.indexOf(anchor)+(after?1:0);rest.splice(at,0,...moving);s.manualOrder=rest;return commit(s,'Ordine condiviso Timeline / Mixer');}

const prefs={relief:.55,darken:.75};

// Functions retained from the approved v5 HTML; waveform data remain synthetic.
function trackVars(t){const c=t.colour;return `--track:${c};--clip-top:${mix(c,'#ffffff',.10+prefs.relief*.19)};--clip-mid:${mix(c,'#19272b',.09)};--clip-bottom:${mix(c,'#10242c',.12+prefs.relief*.17)};--clip-edge:${mix(c,'#101820',.57)};--clip-wave:${mix(c,'#0b171e',.82)};--clip-ink:#102029;--title-halo:${mix(c,'#ffffff',.25)};--sel-top:${mix(c,'#111a22',prefs.darken)};--sel-bottom:${mix(c,'#090f15',Math.min(.94,prefs.darken+.09))};--sel-wave:${mix(c,'#e2f6ef',.27)};--shine:${(.14+prefs.relief*.38).toFixed(2)}`;}
const waveCache=new Map();
function wavePath(seed=1,mode='full'){
 const key=seed+mode;if(waveCache.has(key))return waveCache.get(key);
 const N=mode==='mini'?180:680;let top=[],bot=[];let z=(Math.abs(seed*5137)|0)+11;const rnd=()=>{z=(Math.imul(z,1664525)+1013904223)|0;return (z>>>0)/4294967296;};

function waveform(seed=1,cls='wave',mini=false){return `<svg class="${cls}" viewBox="0 0 1000 100" preserveAspectRatio="none" aria-hidden="true"><path d="${wavePath(seed,mini?'mini':'full')}" fill="currentColor"/><path d="M0 50h1000" stroke="currentColor" stroke-width=".45" opacity=".6"/></svg>`;}
function fadeGeometry(c){

}
function fadePaths(c){

  inTriangle:f.fadeIn>0?`M0 100 L0 0 L${x} 0 Z`:'',
  outTriangle:f.fadeOut>0?`M1000 100 L${y} 0 L1000 0 Z`:'',

}

function flagButton(t,key,label,title,cls=''){const on=!!t[key];return `<button data-action="${key}" data-track="${t.id}" class="${cls} ${on?(key==='mute'?'on-mute':key==='solo'?'on-solo':'active'):''}" aria-pressed="${on}" title="${title}">${label}</button>`;}
function headerHTML(t){const a=audible(t),selected=state.selected.includes(t.id);return `<div class="track-header role-${t.role} ${selected?'selected':''} ${t.height<148?'compact':''}" tabindex="0" role="group" aria-label="${esc(t.name)}, ${roleNames[t.role]}" data-header="${t.id}"><div class="identity"><button class="drag-grip" draggable="${state.mode==='free'&&!t.pinned}" data-drag="${t.id}" title="${state.mode==='free'?'Trascina per riordinare':'Passa a Libera per riordinare'}" ${state.mode!=='free'||t.pinned?'disabled':''}>⠿</button><button class="disclosure" data-action="expanded" data-track="${t.id}" aria-expanded="${t.expanded}" title="${t.expanded?'Ripiega':'Espandi'} lane e controlli">${t.expanded?'▾':'▸'}</button><span class="role-icon">${roleIcons[t.role]}</span><div class="nameblock"><strong title="${esc(t.name)}">${esc(t.name)}</strong><span class="role-name">${roleNames[t.role]}</span></div>${t.role==='songMain'?`<button class="pin ${t.pinned?'active':''}" data-action="pinned" data-track="${t.id}" title="${t.pinned?'Sblocca':'Blocca'} posizione">${t.pinned?'PIN':'↕'}</button>`:''}</div><div class="caps-line"><b>A ${t.audioChannels}</b>${t.midiPins?`<span>M ${t.midiPins}</span>`:''}${t.oscPins?`<span>OSC ${t.oscPins}</span>`:''}${t.dmxPins?`<span>DMX ${t.dmxPins}</span>`:''}<span class="membership">${esc(t.groupName)} ${t.role==='performerMix'?'· convergenza':''}</span></div><div class="header-controls">${flagButton(t,'mute',t.role==='songMain'?'M program':'M',t.role==='songMain'?'Mute del Program, non delle Cue':'Mute diretto','ms')}${t.role!=='songMain'?flagButton(t,'solo','S','Solo diretto','ms'):''}<button class="power ${!t.enabled?'off':''}" data-action="enabled" data-track="${t.id}" aria-pressed="${t.enabled}" title="Attiva/disattiva Tensor nella fixture">⏻</button>${flagButton(t,'bypass','BYP','Bypass della catena fixture')}<span class="control-gap"></span><button data-action="graph" data-track="${t.id}" title="Apri Graph fixture">Graph</button><button data-action="routing" data-track="${t.id}" title="Mostra percorsi logici">Routing</button></div><div class="gain-pan"><label>GAIN<input data-field="gain" data-track="${t.id}" type="range" min="-60" max="12" step=".1" value="${t.gain}" aria-label="Gain ${esc(t.name)}"><output>${t.gain.toFixed(1)}</output></label><label>PAN<input data-field="pan" data-track="${t.id}" type="range" min="-1" max="1" step=".01" value="${t.pan}" aria-label="Pan ${esc(t.name)}"><output>${panText(t.pan)}</output></label></div><div class="header-bottom"><select data-field="monitor" data-track="${t.id}" aria-label="Monitoring ${esc(t.name)}">${['Auto','Live','Playback','Merge'].map(x=>`<option ${x===t.monitor?'selected':''}>${x}</option>`).join('')}</select><button data-action="automations" data-track="${t.id}">Autom. ${t.automations}</button><span class="meta" title="${esc(a.reason)}">${a.program?'● Attiva':a.cue?'◐ Cue':'○ Esclusa'}</span><button data-action="settings" data-track="${t.id}" aria-label="Impostazioni ${esc(t.name)}">···</button></div>${t.expanded?`<div class="extended-controls">${flagButton(t,'buffer','Buffer','Buffer simulato')}${flagButton(t,'oversample','2×','Oversampling simulato')}<button data-action="rename" data-track="${t.id}">Rinomina</button><input type="color" value="${t.colour}" data-field="colour" data-track="${t.id}" title="Colore identità"></div>`:''}<div class="resize-handle" data-resize="${t.id}" title="Trascina per regolare l'altezza"></div></div>`;}
function panText(p){return Math.abs(p)<.005?'C':`${Math.round(Math.abs(p)*100)}${p<0?'L':'R'}`;}
function render(){
 const a=$('#arranger'),top=a.scrollTop,left=a.scrollLeft;
 document.body.classList.toggle('light',!state.dark);document.body.style.setProperty('--hw',state.headerWidth+'px');document.body.style.setProperty('--timeline',Math.max(1440,state.zoom*36)+'px');
 $('#width').value=state.headerWidth;$('#width-value').textContent=state.headerWidth+' px';$('#theme').textContent=state.dark?'Tema chiaro':'Tema scuro';$('#grouped').classList.toggle('active',state.mode==='grouped');$('#free').classList.toggle('active',state.mode==='free');$('#undo').disabled=!past.length;$('#redo').disabled=!future.length;$('#mode-hint').textContent=state.mode==='grouped'?'Struttura della Song · routing invariato':'Trascina dal grip · ordine condiviso col Mixer';$('#mixer-toggle').classList.toggle('active',mixerVisible);
 const globals=[['↔','Range','confini Song',''],['∿','Tempo','120 BPM · fixture','tempo'],['⁴₄','Time Sig','4/4',''],['⚑','Markers','3 eventi','markers'],['#','Counter','count-in',''],['▶','Actions','nessuna azione','']];
 let html=`<div class="timeline-inner"><div class="ruler"><div class="corner">TRACCE / TENSOR <span style="float:right">${state.tracks.length} ENTITÀ</span></div><div class="ruler-grid">${Array.from({length:19},(_,i)=>`<span style="left:${i*2*state.zoom+6}px">${i+1}</span>`).join('')}</div></div>`;
 html+=globals.map(([ic,name,value,type])=>`<div class="global"><div class="ghead"><span class="gicon">${ic}</span><strong>${name}</strong><small>${value}</small></div><div class="gcanvas">${type==='tempo'?'<span class="tempo-line"></span><span class="global-note">120.00</span>':type==='markers'?[['Intro',1],['Verse',8],['Chorus',20]].map(([n,s])=>`<span class="marker" style="left:${s*state.zoom}px">${n}</span>`).join(''):''}</div></div>`).join('');
 let lastGroup='';for(const id of ordered()){const t=track(id),group=t.role==='songMain'?'final':t.group;if(state.mode==='grouped'&&group!==lastGroup){html+=`<div class="group-label"><div>${group==='ayra'?`<button data-group-collapse title="Ripiega gruppo, conserva MIX">${state.groupCollapsed?'▸':'▾'}</button>`:''}${group==='final'?'FINALE DELLA SONG':group==='song'?'SONG TRACKS':esc(t.groupName.toUpperCase())}</div><div class="group-info">${group==='ayra'?'Gruppo di vista · i controlli musicali appartengono al MIX':group==='final'?'Il ruolo resta invariato anche sbloccando la posizione':'Contenuti song-owned'}</div></div>`;lastGroup=group;}
 html+=`<div class="track-row ${state.selected.includes(id)?'selected-row':''}" data-row="${id}" style="--rh:${visualHeight(t)}px;--audio-h:${t.height}px;${trackVars(t)}">${headerHTML(t)}<div class="track-body"><div class="audio-lane">${t.clips.length?t.clips.map(c=>clipHTML(c,t)).join(''):`<div class="lane-empty"><span class="empty-symbol">${roleIcons[t.role]}</span><div><strong>Ingresso audio · ${t.audioChannels} canali</strong><small>${t.role==='songMain'?'Il finale rimane raggiungibile. Le Cue sono distinte dal mute Program.':t.role==='performerMix'?'Tensor post-somma, non una cartella. Una sola lane audio.':'Lane pronta per il contenuto.'}</small></div></div>`}</div>${t.expanded?Array.from({length:t.midiPins},(_,i)=>`<div class="other-lane">MIDI IN ${i+1} · endpoint ${i+1}<span class="notes"></span></div>`).join('')+Array.from({length:t.oscPins},(_,i)=>`<div class="other-lane">OSC IN ${i+1} · nessun evento</div>`).join('')+Array.from({length:t.dmxPins},(_,i)=>`<div class="other-lane">DMX IN ${i+1} · nessun evento</div>`).join('')+`<div class="other-lane" style="height:40px">${t.automations} automazioni · apri il pannello dal controllo dell'header</div>`:''}</div></div>`;}
 a.innerHTML=html+'</div>';a.scrollTop=top;a.scrollLeft=left;
 $('#mixer').classList.toggle('hidden',!mixerVisible);
 $('#mixer-strips').innerHTML=ordered().map(id=>{const t=track(id);return `<div class="mini-strip ${state.selected.includes(id)?'selected':''}" data-select="${id}" style="--track:${t.colour}" tabindex="0"><div class="mini-title"><span style="color:var(--track)">${roleIcons[t.role]}</span><strong>${esc(t.name)}</strong>${t.pinned?'<small>PIN</small>':''}</div><small>${roleNames[t.role]}</small><div class="mini-controls">${flagButton(t,'mute','M','Mute','ms')}${t.role!=='songMain'?flagButton(t,'solo','S','Solo','ms'):''}<input type="range" data-track="${id}" data-field="gain" min="-60" max="12" step=".1" value="${t.gain}" aria-label="Gain mixer ${esc(t.name)}"><output>${t.gain.toFixed(1)}</output></div></div>`;}).join('');
 renderInspector();
}
function renderInspector(){const t=track(state.active);if(!t){$('#inspector').innerHTML='<div class="empty-selected">Seleziona una traccia</div>';return;}const a=audible(t);$('#inspector').innerHTML=`<div class="eyebrow">INSPECTOR / ${state.selected.length} SELEZIONAT${state.selected.length===1?'A':'E'}</div><h2>${esc(t.name)}</h2><span class="role-tag" style="color:${t.colour}">${roleNames[t.role]}</span><p class="context">${esc(t.groupName)}<br>Una sola identità in Timeline e Mixer.</p><div class="state-pill ${!a.program?'warn':''}">${a.program?'●':'◐'} ${esc(a.reason)}</div><section><h3>INGRESSI LOGICI</h3><div class="pin-grid"><span>AUDIO ×${t.audioChannels}</span>${t.midiPins?`<span>MIDI ×${t.midiPins}</span>`:''}${t.oscPins?`<span>OSC ×${t.oscPins}</span>`:''}${t.dmxPins?`<span>DMX ×${t.dmxPins}</span>`:''}</div><p>${t.role==='performerMix'?'La convergenza è un Tensor reale. Ripiegare il gruppo non la nasconde.':t.role==='songMain'?'Mute agisce sul Program. Il percorso Cue della fixture rimane disponibile.':'Espandi l’header per vedere una lane per ogni pin; i canali audio restano dentro una clip.'}</p></section><section><h3>CONTROLLO & PERCORSO</h3><div class="routing-summary">${esc(t.name)}<small>DESTINAZIONE LOGICA</small>${esc(t.route)}</div><div class="key-value"><span>Main gain · fixture</span><b>${t.gain.toFixed(1)} dB</b></div><div class="key-value"><span>Main pan · fixture</span><b>${panText(t.pan)}</b></div><div class="buttons"><button data-action="graph" data-track="${t.id}">Graph</button><button data-action="routing" data-track="${t.id}">Routing</button><button data-action="settings" data-track="${t.id}">Impostazioni</button></div></section><section><h3>IDENTITÀ & VISTA</h3><div class="field"><label>Colore della traccia</label><input data-field="colour" data-track="${t.id}" type="color" value="${t.colour}"></div><div class="buttons"><button data-action="rename" data-track="${t.id}">Rinomina</button><button data-action="expanded" data-track="${t.id}">${t.expanded?'Ripiega':'Espandi'}</button></div><div class="key-value"><span>Ordine</span><b>${state.mode==='grouped'?'Strutturale':'Personale'}</b></div><p>Riordinare non cambia appartenenza, routing o colore ereditato.</p></section><div class="lab-note">I controlli modificano dati dimostrativi, non un segnale audio. Graph, routing e automazioni mostrano il contratto dell’header senza avviare il motore Multiverse.</div>`;}
function openDialog(title,html,eyebrow='AYRA / TIMELINE LAB'){if(gesture)cancelGesture();$('#dialog-title').textContent=title;$('#dialog-eyebrow').textContent=eyebrow;$('#dialog-body').innerHTML=html;if(!$('#dialog').open)$('#dialog').showModal();}
function closeDialog(){mapDraft=null;$('#dialog').close();}
function showSettings(id){const t=track(id);openDialog('Impostazioni · '+t.name,`<p>Controlli del Tensor, non della singola clip. Tutti i valori sono fixture; nessun secondo gain viene aggiunto all’app.</p><div class="field"><label>Nome</label><input id="setting-name" value="${esc(t.name)}" maxlength="256"></div><div class="field"><label>Colore identità</label><input id="setting-colour" type="color" value="${t.colour}"></div><div class="field"><label>Buffer</label><input id="setting-buffer" type="checkbox" ${t.buffer?'checked':''}></div><div class="field"><label>Oversampling 2×</label><input id="setting-os" type="checkbox" ${t.oversample?'checked':''}></div><div class="field"><label>Posizione pinnata</label><input id="setting-pin" type="checkbox" ${t.pinned?'checked':''}></div><div class="dialog-footer"><button data-close>Annulla</button><button class="primary" id="settings-apply">Applica</button></div>`);$('#settings-apply').onclick=()=>{const s=clone(state),t=s.tracks.find(x=>x.id===id);t.name=$('#setting-name').value.trim();t.colour=$('#setting-colour').value;t.buffer=$('#setting-buffer').checked;t.oversample=$('#setting-os').checked;t.pinned=$('#setting-pin').checked;if(commit(s,'Impostazioni traccia'))closeDialog();};}
function showGraph(id){const t=track(id);openDialog('Graph · '+t.name,`<p>Catena dimostrativa. Il progetto nativo emette lo stesso intento <b>OpenGraph</b>; in produzione verrà aperto il Tensor esistente, non ricostruito qui.</p>${['Main In · '+t.audioChannels+' ch','Trim · Main gain '+t.gain.toFixed(1)+' dB','EQ / Processor · '+(t.bypass?'Bypass':'Attivo'),'Main Out · '+t.audioChannels+' ch'].map(n=>`<div class="route-node">${esc(n)}</div>`).join('')}<div class="dialog-footer"><button data-close>Chiudi</button></div>`);}
function showRouting(id){const t=track(id);openDialog('Routing · '+t.name,`<p>Destinazioni logiche della fixture, in sola lettura. Il riordino delle tracce non modifica questa struttura.</p><div class="routing-list"><div><strong>Main Out</strong><small>${esc(t.route)}</small></div>${t.role!=='songMain'?'<div><strong>Cue Ayra</strong><small>Route esplicita · fixture</small></div>':'<div><strong>Cue</strong><small>Pre-mute Program · fixture</small></div>'}<div><strong>Monitoring</strong><small>${t.monitor}</small></div></div><div class="dialog-footer"><button data-close>Chiudi</button></div>`);}
function showAutomations(id){const t=track(id);openDialog('Automazioni · '+t.name,`<p>Inventario dimostrativo di parametri. Nessun pulsante Record / Write viene inventato senza un motore di authoring.</p><div class="routing-list">${Array.from({length:t.automations},(_,i)=>`<div><strong>${['Main gain','Cutoff · EQ','Main pan'][i%3]}</strong><small>Curva fixture ${i+1}</small></div>`).join('')}</div><div class="dialog-footer"><button id="automation-add">Aggiungi parametro fixture</button><button data-close>Chiudi</button></div>`);$('#automation-add').onclick=()=>{if(t.automations<64){editTrack(id,'automations',track(id).automations+1,'Aggiunta automazione fixture');showAutomations(id);}};}
function showClip(id,clipId){const t=track(id),c=t.clips.find(x=>x.id===clipId);if(!c)return;openDialog('Editor clip · '+c.name,`<p>${c.channels} canali sorgente · ${t.audioChannels} posizioni del bus. Una sola clip. L’ordine dei canali appartiene alla traccia e si applica a tutti i suoi eventi.</p><div style="height:160px;position:relative;${trackVars(t)}">${clipHTML(c,t).replace(`left:${c.start*state.zoom}px;width:${c.length*state.zoom}px`,'left:0;width:100%')}</div><div class="field"><label>Fade in (secondi)</label><input id="clip-fi" type="number" min="0" max="${c.length}" step=".05" value="${c.fadeIn}"></div><div class="field"><label>Fade out (secondi)</label><input id="clip-fo" type="number" min="0" max="${c.length}" step=".05" value="${c.fadeOut}"></div><div class="dialog-footer"><button id="channels-button">Channels / Mapping…</button><button id="clip-apply" class="primary">Applica fade</button><button data-close>Chiudi</button></div>`);$('#channels-button').onclick=()=>showMapping(id,clipId);$('#clip-apply').onclick=()=>{const s=clone(state),c=s.tracks.find(x=>x.id===id).clips.find(x=>x.id===clipId);c.fadeIn=Number($('#clip-fi').value);c.fadeOut=Number($('#clip-fo').value);if(commit(s,'Fade clip'))closeDialog();};}
function showMapping(id,clipId){const t=track(id);mapDraft={id,clipId,order:[...t.order]};paintMapping();}
function paintMapping(){const draft=mapDraft,t=track(draft.id),c=t.clips.find(x=>x.id===draft.clipId);openDialog('Channels / Mapping',`<p><b>${esc(t.name)}</b> · ordine condiviso, ${t.clips.length} clip interessate.<br>Dall’alto al basso: posizione 1 → N. I vuoti restano visibili; il canale originale conserva la sua identità.</p><div id="mapping-rows">${draft.order.map((src,i)=>`<div class="mapping-row" draggable="true" data-map-index="${i}"><span class="position">${i+1}</span><span>⠿</span><strong>${src<c.channels?channelLabel(c,src):'Vuoto in questa clip'}<small>Slot originale ${src+1} · identità preservata</small></strong><button data-map-move="${i}" data-step="-1" ${i===0?'disabled':''}>↑</button><button data-map-move="${i}" data-step="1" ${i===draft.order.length-1?'disabled':''}>↓</button></div>`).join('')}</div><div class="dialog-footer"><button id="map-reset">Ordine originale</button><button data-close>Annulla</button><button id="map-apply" class="primary">Applica a ${t.clips.length} clip</button></div>`);mapDraft=draft;$('#map-reset').onclick=()=>{mapDraft.order=Array.from({length:t.audioChannels},(_,i)=>i);paintMapping();};$('#map-apply').onclick=()=>{editTrack(t.id,'order',[...mapDraft.order],'Ordine canali condiviso');closeDialog();};}
function showSave(){openDialog('Salva il banco di test',`<p>HTML e applicazione nativa condividono il formato <b>ayra-timeline-lab/1</b>. Non è un file progetto Multiverse e non va importato come .aym.</p><div class="download-list"><button id="export-html">Salva questo mockup HTML con le modifiche</button><button id="export-json">Esporta sessione JSON per il banco JUCE</button><button id="import-json">Importa sessione JSON</button></div>`);$('#export-html').onclick=()=>{const doc=document.documentElement.cloneNode(true);doc.querySelector('#lab-state').textContent=JSON.stringify(state).replace(/</g,'\\u003c');doc.querySelector('dialog').removeAttribute('open');download('<!doctype html>\n'+doc.outerHTML,'ayra-header-lab-modificato.html','text/html');};$('#export-json').onclick=()=>download(JSON.stringify(state,null,2),'ayra-header-lab.json','application/json');$('#import-json').onclick=()=>$('#import-file').click();}
function download(data,name,type){const u=URL.createObjectURL(new Blob([data],{type})),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);}
function help(){openDialog('Gesti del banco di test',`<div class="help-grid"><b>Click header</b><span>Selezione della traccia, non delle clip</span><b>Ctrl/Cmd · click</b><span>Aggiungi/togli dalla selezione</span><b>Shift · click</b><span>Intervallo di tracce visibili</span><b>Grip ⠿</b><span>Riordina in modalità Libera</span><b>Bordo inferiore</b><span>Resize verticale; Escape annulla</span><b>▸ / ▾</b><span>Espandi le lane dei pin e i controlli</span><b>Doppio click clip</b><span>Editor → Channels / Mapping</span><b>Ctrl/Cmd Z</b><span>Undo; Shift per Redo</span><b>F2</b><span>Rinomina l’header attivo</span><b>Alt ↑ / ↓</b><span>Riordina l’header attivo in Libera</span></div><div class="dialog-footer"><button data-close>Ho capito</button></div>`);}
document.addEventListener('click',e=>{const close=e.target.closest('[data-close]');if(close){closeDialog();return;}const actionEl=e.target.closest('[data-action]');if(actionEl){const id=actionEl.dataset.track,k=actionEl.dataset.action;if(['mute','solo','enabled','bypass','expanded','pinned','buffer','oversample'].includes(k))toggle(id,k);else if(k==='graph')showGraph(id);else if(k==='routing')showRouting(id);else if(k==='automations')showAutomations(id);else if(k==='settings')showSettings(id);else if(k==='rename'){const t=track(id);openDialog('Rinomina traccia',`<div class="field"><label>Nome</label><input id="rename-name" value="${esc(t.name)}" maxlength="256"></div><div class="dialog-footer"><button data-close>Annulla</button><button class="primary" id="rename-apply">Applica</button></div>`);$('#rename-apply').onclick=()=>{if(editTrack(id,'name',$('#rename-name').value.trim(),'Rinomina traccia'))closeDialog();};}return;}
 const mapButton=e.target.closest('[data-map-move]');if(mapButton&&mapDraft){const i=+mapButton.dataset.mapMove,j=i+(+mapButton.dataset.step);[mapDraft.order[i],mapDraft.order[j]]=[mapDraft.order[j],mapDraft.order[i]];paintMapping();return;}
 if(e.target.closest('[data-group-collapse]')){const s=clone(state);s.groupCollapsed=!s.groupCollapsed;commit(s,'Gruppo di vista');return;}
 if(e.target.closest('button,input,select,a'))return;
 const header=e.target.closest('[data-header]'),mini=e.target.closest('[data-select]');if(header)select(header.dataset.header,e);else if(mini)select(mini.dataset.select,e);
});
document.addEventListener('contextmenu',e=>{const h=e.target.closest('[data-header]');if(h){e.preventDefault();showSettings(h.dataset.header);}});
document.addEventListener('input',e=>{const el=e.target;if(el.dataset.field==='gain'||el.dataset.field==='pan'){const output=el.parentElement.querySelector('output');if(output)output.textContent=el.dataset.field==='gain'?Number(el.value).toFixed(1):panText(+el.value);}});
document.addEventListener('change',e=>{const el=e.target,k=el.dataset.field;if(!k)return;const v=['gain','pan'].includes(k)?Number(el.value):el.value;editTrack(el.dataset.track,k,v,`${k} · ${track(el.dataset.track).name}`);});

$('#import-file').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;if(f.size>2*1024*1024){announce('File oltre 2 MiB: rifiutato');return;}try{const s=JSON.parse(await f.text());validate(s);commit(s,'Import sessione Lab');closeDialog();}catch(err){announce('Import rifiutato: '+err.message);}};
$('#dialog').addEventListener('cancel',()=>{mapDraft=null;});
let dragged=null,mapIndex=-1;
document.addEventListener('dragstart',e=>{const map=e.target.closest('[data-map-index]');if(map&&mapDraft){mapIndex=+map.dataset.mapIndex;e.dataTransfer.setData('text/plain','map:'+mapIndex);return;}const grip=e.target.closest('[data-drag]');if(!grip||state.mode!=='free'){e.preventDefault();return;}const id=grip.dataset.drag;if(track(id).pinned){e.preventDefault();return;}dragged=state.selected.includes(id)?ordered().filter(x=>state.selected.includes(x)&&!track(x).pinned):[id];e.dataTransfer.setData('text/plain',JSON.stringify(dragged));e.dataTransfer.effectAllowed='move';});
document.addEventListener('dragover',e=>{if(mapDraft&&mapIndex>=0&&e.target.closest('[data-map-index]')){e.preventDefault();return;}const row=e.target.closest('[data-row]');if(!dragged||!row||track(row.dataset.row).pinned)return;e.preventDefault();$$('.drop-before,.drop-after').forEach(x=>x.classList.remove('drop-before','drop-after'));const rect=row.getBoundingClientRect();row.classList.add(e.clientY<rect.top+rect.height/2?'drop-before':'drop-after');const ar=$('#arranger'),r=ar.getBoundingClientRect();if(e.clientY<r.top+35)ar.scrollTop-=12;else if(e.clientY>r.bottom-35)ar.scrollTop+=12;});

document.addEventListener('dragend',()=>{dragged=null;mapIndex=-1;$$('.drop-before,.drop-after').forEach(x=>x.classList.remove('drop-before','drop-after'));});
function cancelGesture(){if(!gesture)return;gesture=null;render();announce('Gesto annullato');}
document.addEventListener('pointerdown',e=>{if(e.button!==0||$('#dialog').open)return;const res=e.target.closest('[data-resize]');if(res){e.preventDefault();const t=track(res.dataset.resize);gesture={kind:'resize',id:t.id,y:e.clientY,height:t.height,pointer:e.pointerId,value:t.height};res.setPointerCapture(e.pointerId);return;}const el=e.target.closest('[data-clip]');if(!el)return;e.preventDefault();const t=track(el.dataset.track),c=t.clips.find(c=>c.id===el.dataset.clip);state.selectedClip=c.id;$$('.clip').forEach(x=>x.classList.toggle('selected',x.dataset.clip===c.id));const fade=e.target.closest('[data-fade]');gesture={kind:fade?'fade':'clip',side:fade?.dataset.fade,id:t.id,clip:c.id,original:clone(c),x:e.clientX,y:e.clientY,pointer:e.pointerId,value:clone(c),moved:false,lastDx:0,delta:0};el.setPointerCapture(e.pointerId);});
document.addEventListener('pointermove',e=>{if(!gesture||gesture.pointer!==e.pointerId)return;const g=gesture;if(g.kind==='resize'){const t=track(g.id);g.value=Math.round(clamp(g.height+e.clientY-g.y,minimumHeight(t),1200));const row=document.querySelector(`[data-row="${g.id}"]`);row.style.setProperty('--rh',visualHeight({...t,height:g.value})+'px');row.style.setProperty('--audio-h',g.value+'px');return;}const dx=e.clientX-g.x;if(!g.moved&&Math.abs(dx)<4)return;g.moved=true;g.delta+=(dx-g.lastDx)/state.zoom*(e.shiftKey?.1:1);g.lastDx=dx;const c=clone(g.original),d=g.delta;if(g.kind==='clip'){c.start=clamp(e.ctrlKey?c.start+d:Math.round((c.start+d)*4)/4,0,3600);}else if(g.side==='in')c.fadeIn=clamp(c.fadeIn+d,0,c.length-c.fadeOut);else c.fadeOut=clamp(c.fadeOut-d,0,c.length-c.fadeIn);g.value=c;const el=$(`#arranger [data-clip="${g.clip}"]`);if(g.kind==='clip')el.style.left=c.start*state.zoom+'px';else{const f=fadePaths(c);el.querySelector('.fade-in-shade').setAttribute('d',f.inTriangle);el.querySelector('.fade-out-shade').setAttribute('d',f.outTriangle);el.querySelector('.fade-line').setAttribute('d',f.lines);el.querySelector('.fade-line-halo').setAttribute('d',f.lines);el.querySelector('.fade-handle.in').style.left=`clamp(8px,${f.left/10}%,calc(100% - 8px))`;el.querySelector('.fade-handle.out').style.left=`clamp(8px,${f.right/10}%,calc(100% - 8px))`;}});
document.addEventListener('pointerup',e=>{if(!gesture||gesture.pointer!==e.pointerId)return;const g=gesture;gesture=null;if(g.kind==='resize')editTrack(g.id,'height',g.value,'Altezza traccia');else if(g.moved){const s=clone(state),t=s.tracks.find(x=>x.id===g.id);t.clips[t.clips.findIndex(x=>x.id===g.clip)]=g.value;commit(s,g.kind==='clip'?'Posizione clip fixture':'Fade clip');}else renderInspector();});

document.addEventListener('keydown',e=>{const text=e.target.matches('input,select,textarea,[contenteditable=true]');if(e.key==='Escape'){if(gesture){e.preventDefault();cancelGesture();}dragged=null;return;}if(text)return;if($('#dialog').open)return;if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){e.preventDefault();e.shiftKey?redo():undo();return;}if(e.key==='F2'&&state.active){e.preventDefault();document.querySelector(`[data-header="${state.active}"] [data-action="settings"]`).click();return;}const h=e.target.closest('[data-header]');if(h&&(e.key==='Enter'||e.key===' ')){e.preventDefault();select(h.dataset.header,e);}if(e.altKey&&['ArrowUp','ArrowDown'].includes(e.key)&&state.active){e.preventDefault();const ids=ordered().filter(x=>!track(x).pinned),i=ids.indexOf(state.active),j=i+(e.key==='ArrowUp'?-1:1);if(j>=0&&j<ids.length)move([state.active],ids[j],j>i);}});
